name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate and format project files
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate complete Flutter platform projects when incomplete
        shell: bash
        run: |
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]] || \
             [[ ! -d ios/Runner.xcodeproj ]] || \
             [[ ! -d macos/Runner.xcodeproj ]] || \
             [[ ! -d windows/runner ]] || \
             [[ ! -d linux/runner ]]; then
            rm -rf android ios web windows linux macos
            flutter create \
              --project-name=bloc_assignment_app \
              --platforms=android,ios,web,windows,linux,macos .
          fi

      - name: Resolve packages and generate pubspec.lock
        run: flutter pub get

      - name: Format all Dart sources
        run: dart format .

      - name: Commit generated files and formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate Flutter scaffolding and format sources"
            git push origin main
          fi

  verify:
    name: Analyze, test and build Android
    needs: bootstrap
    if: always() && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform projects in the validation workspace when needed
        shell: bash
        run: |
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]] || \
             [[ ! -d ios/Runner.xcodeproj ]] || \
             [[ ! -d macos/Runner.xcodeproj ]] || \
             [[ ! -d windows/runner ]] || \
             [[ ! -d linux/runner ]]; then
            rm -rf android ios web windows linux macos
            flutter create \
              --project-name=bloc_assignment_app \
              --platforms=android,ios,web,windows,linux,macos .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze with warnings treated as errors
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: bloc-assignment-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generate native Flutter projects and lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Generate missing native project scaffolding
        shell: bash
        run: |
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]] || \
             [[ ! -f ios/Runner.xcodeproj/project.pbxproj ]] || \
             [[ ! -f macos/Runner.xcodeproj/project.pbxproj ]] || \
             [[ ! -f windows/runner/CMakeLists.txt ]] || \
             [[ ! -f linux/runner/CMakeLists.txt ]]; then
            rm -rf android ios web windows linux macos
            flutter create \
              --project-name=bloc_assignment_app \
              --platforms=android,ios,web,windows,linux,macos .
          fi

      - name: Resolve dependencies and create pubspec.lock
        run: flutter pub get

      - name: Format all Dart files
        run: dart format .

      - name: Commit generated scaffolding and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate Flutter platform projects and lock dependencies [skip ci]"
            git push origin main
          fi

  verify:
    name: Format, analyze, test and build Android
    needs: bootstrap
    if: always() && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Generate native projects in the validation workspace when needed
        shell: bash
        run: |
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]] || \
             [[ ! -f ios/Runner.xcodeproj/project.pbxproj ]] || \
             [[ ! -f macos/Runner.xcodeproj/project.pbxproj ]] || \
             [[ ! -f windows/runner/CMakeLists.txt ]] || \
             [[ ! -f linux/runner/CMakeLists.txt ]]; then
            rm -rf android ios web windows linux macos
            flutter create \
              --project-name=bloc_assignment_app \
              --platforms=android,ios,web,windows,linux,macos .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze with warnings treated as errors
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Run integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/app_test.dart -d emulator-5554

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: bloc-assignment-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
